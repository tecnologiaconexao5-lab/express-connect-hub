  <body>
    <div id="root"></div>
    <script>
      (function() {
        const SW_UNREGISTERED_FLAG = 'express_sw_unregistered';

        async function cleanupServiceWorker() {
          if (!('serviceWorker' in navigator)) return false;

          let cleaned = false;

          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            if (registrations.length > 0) {
              cleaned = true;
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
          } catch (error) {
            console.warn('[SW Cleanup] Failed to unregister service workers:', error);
          }

          if ('caches' in window) {
            try {
              const cacheKeys = await caches.keys();
              if (cacheKeys.length > 0) {
                cleaned = true;
                await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey)));
              }
            } catch (error) {
              console.warn('[SW Cleanup] Failed to clear caches:', error);
            }
          }

          if (cleaned && !localStorage.getItem(SW_UNREGISTERED_FLAG)) {
            localStorage.setItem(SW_UNREGISTERED_FLAG, '1');
            window.location.reload();
          }

          return cleaned;
        }

        cleanupServiceWorker();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
